name: Daily scan

on:
  schedule:
    - cron: "7 20 * * *"     # 05:07 JST every day
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "scanner/watchlist.yaml"
      - "scanner/config.yaml"
      - "scanner/rules.yaml"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Scan
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_ORIGIN: ${{ secrets.RAKUTEN_ORIGIN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$EBAY_CLIENT_ID" ]; then
            echo "API keys not set yet — publishing SAMPLE data so the app still works."
            python scanner/scan.py --mock
          else
            python scanner/scan.py
          fi
      - name: Commit results
        run: |
          git config user.name "resale-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/results.json scanner/cache/translations.json
          git diff --cached --quiet || git commit -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

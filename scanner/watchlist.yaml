# Your watchlist. Add, remove or edit items here (you can do this from the GitHub app on your phone).
#
# Fields:
#   id           short unique name
#   name         display name (English)
#   category     knife | pedal | record | cd_dvd | game | book | fishing | watch | kitchenware | kimono | cards
#   rakuten      what to search on 楽天市場 (Rakuten Ichiba), in Japanese
#   ebay         what to search on eBay, in English
#   must_include words that MUST appear in every listing title, Rakuten and eBay (case and full-width ignored)
#   rakuten_must_include / ebay_must_include   extra required words for just one side (e.g. Japanese vs English)
#   exclude      words that disqualify a listing (accessories, wrong model, etc.)
#   price_jpy    [min, max] Rakuten price band, to skip accessories and bundles
#   price_usd    [min, max] eBay price band
#   condition    NEW | USED | ANY  (for eBay comps)
#   weight_g     packed weight for shipping
#   shipping_override_jpy  optional fixed shipping cost instead of the EMS table


        - valid_from: "2000-01-01"
          zone1: {1000: 2050, 2000: 2750, 3000: 3450, 4000: 4150, 5000: 4850}
          zone2: {1000: 2500, 2000: 3700, 3000: 4900, 4000: 6100, 5000: 7300}
          zone3: {1000: 3850, 2000: 6000, 3000: 8150, 4000: 10300, 5000: 12450}
          zone4: {1000: 4200, 2000: 6700, 3000: 9200, 4000: 11700, 5000: 14200}
          zone5: {1000: 4550, 2000: 7250, 3000: 9950, 4000: 12650, 5000: 15350}
        - valid_from: "2027-02-01"
          zone1: {1000: 2570, 2000: 3870, 3000: 5000, 4000: 6120, 5000: 7250}
          zone2: {1000: 3420, 2000: 4910, 3000: 6210, 4000: 7520, 5000: 8820}
          zone3: {1000: 4590, 2000: 6930, 3000: 9090, 4000: 11250, 5000: 13410}
          zone4: {1000: 6660, 2000: 9270, 3000: 11700, 4000: 14130, 5000: 16560}
          zone5: {1000: 5220, 2000: 8190, 3000: 11160, 4000: 14130, 5000: 17100}

# Money set aside per sale for returns, damage in transit and lost parcels (share of sale price).
# Replaced by your real return rate once the calibration file has 10+ sales.
risk:
  reserve_by_category: {default: 0.02, knife: 0.03, kitchenware: 0.05, watch: 0.04}
  # Extra reserve for countries where the buyer pays import tax on delivery: some refuse the parcel and you pay
  # for the return. ASSUMPTION — replace with your own experience.
  on_delivery_tax_extra: 0.02

# Turn on only if you register as a 課税事業者 (business registered for consumption tax) and use 原則課税
# (the general calculation method). Then the 10% consumption tax in your purchase prices and in eBay's fees
# comes back as a refund, because exports are zero-rated.
tax:
  consumption_tax_refund: false

# Your real sales, exported from the Google Sheet's "Calibration" tab as CSV and saved as
# scanner/calibration/sales.csv. Used to replace assumptions with what actually happened.
calibration:
  file: calibration/sales.csv
  min_sales_for_fees: 5
  min_sales_for_returns: 10

# Weekly ideas for new watchlist items: popular Rakuten items checked against eBay.com.
discover:
  enabled: true
  weekday: 0                 # 0 = Monday (runs with the 05:07 scan)
  per_keyword: 10
  min_profit_jpy: 3000
  keywords:
    - {q: "牛刀 日本製", category: knife, weight_g: 800}
    - {q: "エフェクター 日本製", category: pedal, weight_g: 900}
    - {q: "スピニングリール", category: fishing, weight_g: 1200}
    - {q: "南部鉄器", category: kitchenware, weight_g: 2500}

scan:
  rakuten_hits: 30              # results fetched per watchlist item
  candidates_per_item: 5        # cheapest matching Rakuten listings kept per item
  ebay_limit: 100
  thin_margin_warning: 0.15     # warn when margin is below this
  # eBay sites to search. Leave as 'all', or list fewer (e.g. [EBAY_US, EBAY_GB, EBAY_DE, EBAY_AU]) to save API calls.
  # Destinations whose site isn't searched use the eBay.com price.
  markets: all
  # The card's headline profit is for the first allowed country in this list (your main market).
  # You can't choose where buyers live, so this avoids showing the cheapest-to-ship country as "the" profit.
  headline_order: [US, GB, DE, AU, CA, FR, IT]

# Filters against drop-shippers and untrustworthy sellers.
trust:
  rakuten:
    hide_below_score: -2       # listings scoring lower are hidden (see scanner/trust.py for the scoring)
    # words in the title or description that suggest the shop doesn't hold stock
    dropship_words: [お取り寄せ, 取り寄せ, 取寄, 海外発送, 海外直送, 予約, 受注生産, 入荷待ち, 納期, 発送まで約, 発送目安]
    blocked_shops: []          # shop names or shop codes you never want to see
    trusted_shops: []          # shops you've bought from happily
  ebay:
    min_feedback_score: 50     # ignore comparison listings from sellers with less feedback
    min_feedback_pct: 98.0
    max_delivery_days: 25      # longer estimated delivery suggests drop-shipping or pre-order
    dropship_words: [pre-order, preorder, made to order, backorder, back order, ships in 2, ships in 3, weeks to ship]
    exclude_sellers: []        # eBay user IDs to ignore (sent to eBay as a filter)
    one_listing_per_seller: true   # stops one big seller with many listings from skewing the price

# Price history kept by the app (builds up from your first scan).
history:
  keep_days: 120
  window_days: 60              # compare against the last 60 days
  min_days: 7                  # need this many days before tagging great deals
  great_deal_below_typical: 0.15   # 🔥 when 15%+ below the item's typical Rakuten price
  price_drop_min: 0.05         # ↓ tag when a listing drops 5%+ since it was last seen
  flash_drop_min: 0.05         # ⚡ tag when a listing drops 5%+ within the last 24 hours (time-limited sales)

# Japan Resale Finder — cost assumptions
# Edit these to match your own eBay invoices and shipping receipts.
# Every number here feeds the profit estimate shown in the app.

fx:
  # Live rates are fetched each scan (Frankfurter / ECB data).
  # These yen-per-unit values are only used if the live fetch fails.
  fallback_jpy_per: {USD: 150.0, GBP: 195.0, EUR: 165.0, AUD: 98.0, CAD: 108.0, PLN: 39.0, SGD: 115.0}
  # Cost of converting your USD payout into JPY (spread + fees). Assumption.
  conversion_cost: 0.02

ebay:
  # Final value fee, % of total sale (item + shipping). 2026 default for most categories.
  final_value_fee: 0.136
  # Category overrides (see watchlist "category" field)
  final_value_fee_by_category:
    watch: 0.15
    record: 0.153
    cd_dvd: 0.153
    book: 0.153
  per_order_fee_usd: 0.40
  # International fee for sellers registered outside the buyer's country. ASSUMPTION — check Seller Hub.
  international_fee: 0.0165
  # Japanese consumption tax charged on eBay's fees for Japan-registered sellers. ASSUMPTION — check your invoice.
  fee_tax: 0.10
  # Price you aim to list at, relative to the median of other Japan-based sellers.
  undercut: 0.97
  # Need at least this many Japan-located comps to trust the median; otherwise all-location comps are used.
  min_jp_comps: 3
  # If a local marketplace (eBay.co.uk etc.) has fewer comps than this, the eBay.com price is used instead.
  min_local_comps: 3

costs:
  packaging_jpy: 300            # box, bubble wrap, tape
  rakuten_domestic_postage_jpy: 800   # used when a Rakuten listing says postage is NOT included

# Destinations the app calculates profit for. Each uses its own local eBay site for prices.
# zone = Japan Post EMS zone. duty = share of sale price YOU pay (DDP). 0 = buyer pays on delivery / at checkout.
# eBay sites the scanner searches for comparable listings. eBay's search API only supports these 12 sites
# (Canada, Switzerland, Belgium and Hong Kong have no search support, so they borrow a nearby site's price).
# Each scan makes 2 calls per site per item. To save calls, list fewer under scan: markets.
markets:
  EBAY_US: {country: US, currency: USD, site: www.ebay.com}
  EBAY_GB: {country: GB, currency: GBP, site: www.ebay.co.uk}
  EBAY_DE: {country: DE, currency: EUR, site: www.ebay.de}
  EBAY_FR: {country: FR, currency: EUR, site: www.ebay.fr}
  EBAY_IT: {country: IT, currency: EUR, site: www.ebay.it}
  EBAY_ES: {country: ES, currency: EUR, site: www.ebay.es}
  EBAY_NL: {country: NL, currency: EUR, site: www.ebay.nl}
  EBAY_IE: {country: IE, currency: EUR, site: www.ebay.ie}
  EBAY_AT: {country: AT, currency: EUR, site: www.ebay.at}
  EBAY_PL: {country: PL, currency: PLN, site: www.ebay.pl}
  EBAY_AU: {country: AU, currency: AUD, site: www.ebay.com.au}
  EBAY_SG: {country: SG, currency: SGD, site: www.ebay.com.sg}

# Countries you can sell to. zone = Japan Post zone (第1地帯 zone 1 China/Korea/Taiwan, 第2地帯 zone 2 rest of Asia,
# 第3地帯 zone 3 Europe/Oceania/Canada/Mexico/Middle East, 第4地帯 zone 4 US, 第5地帯 zone 5 Latin America/Africa).
# market = the eBay site whose prices are used for buyers in that country (if it has too few listings, eBay.com is used).
# import_tax: ebay_collects     = eBay adds VAT/GST at checkout (UK up to £135, EU up to €150, Norway, Switzerland,
#                                 Australia/NZ up to $1,000), so the buyer has nothing to pay on delivery
#             buyer_on_delivery = buyer pays tax/duty to the carrier; some refuse the parcel (extra reserve below)
#             seller_prepays    = you prepay duty before posting (US: DDP via Japan Post's app), counted as a cost
#             none              = no import tax (Hong Kong)
# Countries not listed here (e.g. Russia, where Japan Post has suspended service) should be excluded in your
# eBay shipping policy.
destinations:
  US: {name: United States,   zone: 4, market: EBAY_US, import_tax: seller_prepays, duty: 0.125, ddp_prepay_fee_jpy: 0}
  CA: {name: Canada,          zone: 3, market: EBAY_US, import_tax: buyer_on_delivery}
  MX: {name: Mexico,          zone: 3, market: EBAY_US, import_tax: buyer_on_delivery}
  GB: {name: United Kingdom,  zone: 3, market: EBAY_GB, import_tax: ebay_collects}
  IE: {name: Ireland,         zone: 3, market: EBAY_IE, import_tax: ebay_collects}
  DE: {name: Germany,         zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  FR: {name: France,          zone: 3, market: EBAY_FR, import_tax: ebay_collects}
  IT: {name: Italy,           zone: 3, market: EBAY_IT, import_tax: ebay_collects}
  ES: {name: Spain,           zone: 3, market: EBAY_ES, import_tax: ebay_collects}
  NL: {name: Netherlands,     zone: 3, market: EBAY_NL, import_tax: ebay_collects}
  BE: {name: Belgium,         zone: 3, market: EBAY_NL, import_tax: ebay_collects}
  AT: {name: Austria,         zone: 3, market: EBAY_AT, import_tax: ebay_collects}
  PL: {name: Poland,          zone: 3, market: EBAY_PL, import_tax: ebay_collects}
  PT: {name: Portugal,        zone: 3, market: EBAY_ES, import_tax: ebay_collects}
  SE: {name: Sweden,          zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  DK: {name: Denmark,         zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  FI: {name: Finland,         zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  GR: {name: Greece,          zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  CZ: {name: Czechia,         zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  CH: {name: Switzerland,     zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  "NO": {name: Norway,          zone: 3, market: EBAY_DE, import_tax: ebay_collects}
  AU: {name: Australia,       zone: 3, market: EBAY_AU, import_tax: ebay_collects}
  NZ: {name: New Zealand,     zone: 3, market: EBAY_AU, import_tax: ebay_collects}
  IL: {name: Israel,          zone: 3, market: EBAY_US, import_tax: buyer_on_delivery}
  AE: {name: United Arab Emirates, zone: 3, market: EBAY_US, import_tax: buyer_on_delivery}
  SG: {name: Singapore,       zone: 2, market: EBAY_SG, import_tax: buyer_on_delivery}
  HK: {name: Hong Kong,       zone: 2, market: EBAY_US, import_tax: none}
  MY: {name: Malaysia,        zone: 2, market: EBAY_US, import_tax: buyer_on_delivery}
  TH: {name: Thailand,        zone: 2, market: EBAY_US, import_tax: buyer_on_delivery}
  PH: {name: Philippines,     zone: 2, market: EBAY_US, import_tax: buyer_on_delivery}
  KR: {name: South Korea,     zone: 1, market: EBAY_US, import_tax: buyer_on_delivery}
  TW: {name: Taiwan,          zone: 1, market: EBAY_US, import_tax: buyer_on_delivery}
  BR: {name: Brazil,          zone: 5, market: EBAY_US, import_tax: buyer_on_delivery}
  ZA: {name: South Africa,    zone: 5, market: EBAY_US, import_tax: buyer_on_delivery}

# 楽天ポイント (Rakuten points) counted as a discount on the buy price.
# The shop's point rate comes from the API. Add your personal extra rate here:
# SPU (Super Point Up, from Rakuten Card, Mobile etc.) plus any 買いまわり (shop-hopping bonus) you expect during sales.
points:
  enabled: true
  extra_rate_pct: 0          # e.g. 3 if your SPU gives you +3x on top of the shop's rate
  point_value_jpy: 1.0       # lower this (e.g. 0.9) if you value 期間限定ポイント (limited-time points) less than cash

# Push notifications through the free ntfy app (https://ntfy.sh). Set the NTFY_TOPIC secret to turn on.
alerts:
  min_profit_jpy: 5000
  min_margin: 0.15
  max_per_run: 5
  realert_if_profit_up: 0.20   # alert again if profit on the same listing rises by 20%+
  app_url: https://davepomerlo.github.io/jp-resale-finder/

# Rakuten sale windows (JST). During these, extra scans run hourly 20:37–23:37.
sales:
  super_sale:                    # 楽天スーパーSALE (Rakuten Super Sale) — detected automatically
    months: [3, 6, 9, 12]
    start: {day: 4, time: "20:00"}
    end: {day: 11, time: "01:59"}
  # お買い物マラソン (Shopping Marathon) and other events: add them here once Rakuten announces dates.
  windows:
    - name: 楽天ブラックフライデー (Rakuten Black Friday) — PREDICTED, confirm dates
      start: "2026-11-19 20:00"
      end: "2026-11-26 01:59"

# Japan Post shipping. The app picks the cheapest allowed service for each listing.
# Rates in JPY incl. special surcharges, by packed weight in grams. Checked Oct 2026; new rates from 1 Feb 2027.
shipping:
  allowed_services: [EMS, parcel_air]    # remove parcel_air if you always want the faster EMS
  services:
    EMS:
      # Rates from Japan Post (checked Nov 2026). The second table is the price rise from 1 Feb 2027.
      label: "EMS (express, tracked, insured — about 3–6 days)"
      tables:
        - valid_from: "2000-01-01"
          zone1: {500: 1450, 600: 1600, 700: 1750, 800: 1900, 900: 2050, 1000: 2200, 1250: 2500, 1500: 2800, 1750: 3100, 2000: 3400, 2500: 3900, 3000: 4400, 3500: 4900, 4000: 5400, 4500: 5900, 5000: 6400}
          zone2: {500: 1900, 600: 2150, 700: 2400, 800: 2650, 900: 2900, 1000: 3150, 1250: 3500, 1500: 3850, 1750: 4200, 2000: 4550, 2500: 5150, 3000: 5750, 3500: 6350, 4000: 6950, 4500: 7550, 5000: 8150}
          zone3: {500: 3150, 600: 3400, 700: 3650, 800: 3900, 900: 4150, 1000: 4400, 1250: 5000, 1500: 5550, 1750: 6150, 2000: 6700, 2500: 7750, 3000: 8800, 3500: 9850, 4000: 10900, 4500: 11950, 5000: 13000}
          zone4: {500: 3900, 600: 4180, 700: 4460, 800: 4740, 900: 5020, 1000: 5300, 1250: 5990, 1500: 6600, 1750: 7290, 2000: 7900, 2500: 9100, 3000: 10300, 3500: 11500, 4000: 12700, 4500: 13900, 5000: 15100}
          zone5: {500: 3600, 600: 3900, 700: 4200, 800: 4500, 900: 4800, 1000: 5100, 1250: 5850, 1500: 6600, 1750: 7350, 2000: 8100, 2500: 9600, 3000: 11100, 3500: 12600, 4000: 14100, 4500: 15600, 5000: 17100}
        - valid_from: "2027-02-01"
          zone1: {1000: 2850, 2000: 4300, 3000: 5550, 4000: 6800, 5000: 8050, 6000: 9600, 7000: 10700, 8000: 11800, 9000: 12900}
          zone2: {1000: 3800, 2000: 5450, 3000: 6900, 4000: 8350, 5000: 9800, 6000: 11550, 7000: 12850, 8000: 14150, 9000: 15450}
          zone3: {1000: 5100, 2000: 7700, 3000: 10100, 4000: 12500, 5000: 14900, 6000: 17600, 7000: 20050, 8000: 22500, 9000: 24950}
          zone4: {1000: 7400, 2000: 10300, 3000: 13000, 4000: 15700, 5000: 18400, 6000: 21400, 7000: 24150, 8000: 26900, 9000: 29650}
          zone5: {1000: 5800, 2000: 9100, 3000: 12400, 4000: 15700, 5000: 19000, 6000: 22600, 7000: 25350, 8000: 28100, 9000: 30850}
    parcel_air:
      label: "国際小包 航空便 (international parcel, airmail — tracked, slower)"
